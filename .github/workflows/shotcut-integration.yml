name: Shotcut integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.runtimes.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - id: runtimes
        run: |
          matrix=$(python -B scripts/compatibility_matrix.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  windows-render:
    needs: runtime-matrix
    name: Windows Shotcut ${{ matrix.shotcut }} / Python 3.10
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Download and verify portable Shotcut
        shell: pwsh
        env:
          SHOTCUT_VERSION: ${{ matrix.shotcut }}
          SHOTCUT_SHA256: ${{ matrix.sha256 }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'shotcut.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'Shotcut portable space'
          Invoke-WebRequest "https://github.com/mltframework/shotcut/releases/download/v$env:SHOTCUT_VERSION/shotcut-win64-$env:SHOTCUT_VERSION.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $env:SHOTCUT_SHA256) {
            throw 'Shotcut archive checksum mismatch'
          }
          Expand-Archive $archive $destination
          $melt = Get-ChildItem $destination -Recurse -Filter melt.exe | Select-Object -First 1
          if (!$melt) { throw 'Portable Shotcut does not contain melt.exe' }
          $toolRoot = $melt.Directory.FullName
          "SHOTCUT_MELT_PATH=$($melt.FullName)" >> $env:GITHUB_ENV
          "SHOTCUT_PATH=$(Join-Path $toolRoot 'shotcut.exe')" >> $env:GITHUB_ENV
          "SHOTCUT_FFMPEG_PATH=$(Join-Path $toolRoot 'ffmpeg.exe')" >> $env:GITHUB_ENV
          "SHOTCUT_FFPROBE_PATH=$(Join-Path $toolRoot 'ffprobe.exe')" >> $env:GITHUB_ENV
          "QT_QPA_PLATFORM=offscreen" >> $env:GITHUB_ENV
      - name: Run real MLT integration, including extracted MCPB over stdio
        env:
          SHOTCUT_MCP_INTEGRATION: '1'
          SHOTCUT_MCP_EXPECTED_SHOTCUT: ${{ matrix.shotcut }}
          SHOTCUT_MCP_EXPECTED_MLT: ${{ matrix.mlt }}
        run: python -B -m unittest tests.test_integration -v
