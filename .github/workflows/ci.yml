name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run shared test checks
        run: python -B scripts/check_ci.py test

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pinned quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run shared quality checks
        run: python -B scripts/check_ci.py quality

  integration:
    uses: ./.github/workflows/shotcut-integration.yml

  gate:
    name: CI gate
    if: always()
    needs: [test, quality, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful test, quality, and real integration jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ] || [ "$QUALITY_RESULT" != "success" ] || [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "CI gate failed: test=$TEST_RESULT quality=$QUALITY_RESULT integration=$INTEGRATION_RESULT" >&2
            exit 1
          fi
